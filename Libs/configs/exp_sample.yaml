experiment:
  seeds: [42]

dataset:
  name: twitter15
  root: Input/sample/processed
  raw_root: Input/sample/raw
  mode: eval_prefix
  modes:
    train: train_arbiter
    val: eval_prefix
    test: eval_prefix
  use_lp_edges: false
  text_normalization:
    lowercase: true
    replace_url: true
    replace_mention: true
    replace_number: true
    compress_repeated_chars: true
    keep_hashtag_text: true
  text_encoder:
    model_name_or_path: sentence-transformers/all-mpnet-base-v2
    raw_root: Input/sample/raw
    processed_root: Input/sample/processed
    batch_size: 8
    cache_tag: mpnet_sample
    cache_name: text_embs_mpnet_canonical_v1.pt
    force_text_cache: true
    normalize_embeddings: true
    rebuild_cache: false
  observability_sweep:
    drop_node: []
    drop_edge: []
  prefix:
    strategy: minutes
    unit: minutes
    window: 60
    minutes: 60
    k:
    include_root: true
    window_overrides:
      weibo: 3
      pheme: 3
    unit_overrides:
      weibo: hop
      pheme: hop
  observability:
    drop_edge: 0.0
    drop_node: 0.0
    seed: 1024

device:
  force_cpu: false
  gpu_id: 0
  type: cuda

evaluation:
  ece_bins: 15
  class_names:
    0: non-rumor
    1: 'true'
    2: 'false'
    3: unverified
  detailed: true
  class_names_overrides:
    weibo:
      0: non-rumor
      1: rumor
    pheme:
      0: non-rumor
      1: rumor
  max_samples: 0
  export_predictions:
    enabled: true
  latency:
    enabled: true
    repeat: 1
    warmup_batches: 0
    max_batches: 2
  significance:
    enabled: false
    baseline_models: []
    metrics: [macro_f1, acc]
    n_bootstrap: 100
  early_observation:
    default_windows: [10, 20, 30]
    default_unit: minutes
    windows_overrides:
      weibo: [1, 2, 3]
      pheme: [1, 2, 3]
    unit_overrides:
      weibo: hop
      pheme: hop

link_prediction:
  dropout: 0.3
  early_stopping_patience: 3
  epochs: 3
  grad_clip: 1.0
  heads: 2
  hidden: 128
  lr: 0.0003
  num_layers: 3
  num_workers: 0
  topk_per_node: 2
  weight_decay: 0.0

outputs:
  ckpt_dir: Output/ckpts/sample
  dir: Output/sample/twitter15
  log_dir: Output/logs/sample
  results_dir: Output/results/sample
  prediction_csv: Output/results/sample/predictions.csv
  revision_artifacts_csv: Output/results/sample/revision_artifacts.csv

transfer:
  mode: source_only
  pairs:
    - source: twitter15
      target: twitter16
  models:
    - Libs/configs/baselines/rumordiffusion.yaml
  ckpt_name: best.pt
  lp_edges_policy: require_existing
  results_path: Output/results/sample/transfer.csv
  adaptation:
    target_split: train
    selection_split: val
    adapt_ckpt_name: best_target_adapt.pt

rumordiffusion:
  checkpoint:
    validate_metadata: true
    allow_legacy: false
    ctdm_subdir: rumordiffusion_ctdm_sample
  evaluation:
    uncertainty:
      sampling: stochastic_reverse
      potential_readout: sampled_full_graph
    early_observation:
      default_windows: [10, 20, 30]
      default_unit: minutes
      windows_overrides:
        weibo: [1, 2, 3]
        pheme: [1, 2, 3]
      unit_overrides:
        weibo: hop
        pheme: hop
    early_stop:
      enabled: true
      samples: 2
      max_batches: 2
      tau_low: 0.3
      tau_high: 0.7
      gamma: 0.02
      rumor_classes: [1, 2, 3]
    sampling_sweep:
      enabled: false
      samples: [1, 2]
      max_batches: 1
    threshold_sweep:
      enabled: false
      samples: 1
      tau_low: []
      tau_high: []
      gamma: []
      max_batches: 1
    robustness:
      edge_dropout: []
    calibration:
      enabled: true
      type: temperature
      fit_split: val
      ece_bins: 15
      max_iter: 20
      lr: 0.05
      init_temp: 1.0
  arbiter:
    dropout: 0.3
    freeze_ctdm: true
    hidden: 256
    input_norm: true
    readout: cls
    token_norm: layernorm
    token_dropout: 0.3
    pair_ids: [1, 2]
    tf_head_enabled: true
    tf_infer_adjust_alpha: 0.15
    uncertainty_force_ctdm: true
    transformer:
      dim_feedforward: 512
      dropout: 0.3
      nhead: 8
      nlayers: 3
    type: transformer
    use_pair_token: true
  ctdm:
    T: 50
    backbone:
      aggregators: [mean, min, max, std]
      dropout: 0.3
      heads: 8
      name: gat
      scalers: [identity, amplification, attenuation]
    dropout: 0.3
    film_hidden: 128
    guidance_p: 0.2
    guidance_scale: 3.0
    sampling_eta: 1.0
    hidden: 256
    max_nodes: 0
    multiwindow:
      enabled: true
      max: 30
      min: 10
    num_layers: 3
    obs_minutes: 30
    regularizers:
      lambda_deg_kl: 0.07
      lambda_proto: 0.10
      lambda_proto_orth: 0.10
      lambda_supcon_pair: 0.15
      lambda_topo_bce: 0.10
      momentum: 0.9
      pair_ids: [1, 2]
      temperature: 0.07
    sparse_pairs:
      enabled: true
      lambda_degree: 1.0
      lambda_time: 1.0
      strategy: b
      topk: 8
    t_embed_dim: 64
    t_stride: 25
  dd_gan:
    enabled: true
    lambda_gan: 0.08
    lambda_r1: 10.0
    lr_d: 0.0001
  explain:
    enabled: false
    samples: 1
    tau_low: 0.3
    tau_high: 0.7
    gamma: 0.02
    rumor_classes: [1, 2, 3]
    source_ids: ""
    case_selection:
      enabled: false
  dataset_overrides:
    weibo:
      arbiter:
        pair_ids: [0, 1]
      ctdm:
        regularizers:
          pair_ids: [0, 1]
    pheme:
      arbiter:
        pair_ids: [0, 1]
      ctdm:
        regularizers:
          pair_ids: [0, 1]
  loss:
    la_gamma: 2.2
    la_smooth: 0.05
    la_tau: 1.0
    lambda_pair_margin: 0.2
    lambda_tf_bce: 0.2
    pair_margin_enabled: true
    pair_margin_m: 0.7
    w_brier: 0.01
    w_cons: 0.05
  potentials_dir: rd_potentials
  seed_scoped_potentials: true
  potentials_pair: [0, 1, 2, 3]
  text:
    backend: sentence-transformers
    enabled: true
    fuse_mode: concat
    model: all-mpnet-base-v2
    text_dim: 768
    robust_text:
      noise_std: []
      dropout_p: []

training:
  amp: true
  batch_size: 4
  batch_size_ctdm: 1
  early_stopping_patience: 2
  epochs: 2
  epochs_ctdm: 2
  grad_clip: 1.0
  lr: 0.0003
  lr_ctdm: 0.0003
  num_workers: 0
  use_tqdm: false
  weight_decay: 0.0001
  weight_decay_ctdm: 0.0001
  max_batches_per_epoch: 2
  min_epochs: 1
  max_samples: 8
